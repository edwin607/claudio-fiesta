<script>

/* ---------- name recognition: "Claudio" in Spanish & English ---------- */

let recog=null,nameAt=-9,lastNameReact=-9;

/* ---------- la jarra de Claudio: salud / seco / invítame ---------- */
const glass={level:0,shown:0,hi:0,lastSip:0,asked:false,rect:null};

window._claudio={hearName,hearSalud,hearSeco,hearInvitame,hearBaila,startFolk,hearMove,glass,toggleChat,chatHear,spanglishReply,learnPerson,extractName,extractOrigin,mem,get folk(){return folk},get chatOn(){return chatOn},get move(){return move}};

/* generated música: cumbia/huayño-ish loop, so the room always has a band */
function hit(type,t){
  const g=ctx.createGain(); g.connect(musicGain);
  if(type==='kick'){const o=ctx.createOscillator();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);g.gain.setValueAtTime(.95,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);o.start(t);o.stop(t+.25);}

function tone(fr,t,dur,type,vol,vib){

const SEMI=[0,3,5,7,10,12,15];
const MEL=[4,-1,3,-1,2,-1,3,-1,4,-1,3,2,1,-1,0,-1,2,-1,3,-1,4,-1,5,-1,4,3,2,-1,1,-1,0,-1];

function playStep(s,t){

/* ---------- perception + learning ---------- */
const S={level:0,floor:.008,peak:.05,n:0,bass:0,mid:0,high:0,bpm:0,conf:0,mode:'tranquilo',src:'',tapE:0,active:false,peaks:0};

const hist=new Float32Array(100);
function addOnset(now,tap){ if(now-lastOn<.11)return false; lastOn=now; onsets.push(now); if(onsets.length>40)onsets.shift(); S.onset=now; if(tap){S.tapE=1;} return true; }

  const rec=onsets.filter(o=>now-o<12); if(rec.length<5){S.conf=0;return;}
  hist.fill(0);
  for(let i=0;i<rec.length;i++)for(let j=i+1;j<Math.min(rec.length,i+5);j++){
    let b=60/(rec[j]-rec[i]); if(!isFinite(b))continue; while(b<70)b*=2; while(b>=170)b/=2;
    const c=Math.round(b-70); for(let k=-3;k<=3;k++){const id=c+k; if(id>=0&&id<100)hist[id]+=Math.exp(-k*k/4);}
  }

    else S.bpm=lerp(S.bpm,est,.2);

}
function analyse(dt,now){
  let rms=0,b=0,m=0,h=0,flux=0,hflux=0;
  const live=analyser&&(micOn||mus.on);
  if(live){
    analyser.getByteTimeDomainData(tdom);analyser.getByteFrequencyData(freq);
    let s=0;for(let i=0;i<tdom.length;i++){const v=(tdom[i]-128)/128;s+=v*v}rms=Math.sqrt(s/tdom.length);

    b/=(i200-1)*255;m/=(i3k-i200)*255;h/=(i8k-i3k)*255;
    for(let i=1;i<i2k5;i++){const d=freq[i]-prevF[i]; if(d>0)flux+=d*(i<i200?2.2:1)}

  if(live){ if(rms<S.floor)S.floor=lerp(S.floor,rms,Math.min(1,dt*3)); else S.floor+=(rms-S.floor)*dt*.004; }

  S.n=lerp(S.n,Math.max(n,S.tapE*.85),Math.min(1,dt*10));

  if(live){ fluxAvg=lerp(fluxAvg,flux,.04); if(flux>fluxAvg*1.7+.012&&S.level>.015){ if(addOnset(now,false)){ onBeat(now);} } }

/* ---------- voice profile: cheap spectral fingerprint ---------- */
const voice={sum:0,sumSq:0,n:0,pitchSum:0,pitchN:0};
function voiceSample(){
  if(!analyser||!micOn)return;
  analyser.getByteTimeDomainData(tdom);
  let zc=0,sum=0,peak=0;
  for(let i=1;i<tdom.length;i++){const v=(tdom[i]-128)/128;sum+=v*v;if(Math.abs(v)>peak)peak=Math.abs(v);if((tdom[i-1]-128)*(tdom[i]-128)<0)zc++}
  const rms=Math.sqrt(sum/tdom.length);
  if(rms>.02&&peak>.05){ // someone is speaking
    const pitch=zc*ctx.sampleRate/(2*tdom.length); // rough zero-crossing pitch Hz
    if(pitch>60&&pitch<500){voice.pitchSum+=pitch;voice.pitchN++}
    voice.sum+=rms;voice.sumSq+=rms*rms;voice.n++;
    if(voice.n===80){ // after ~1.5s of speech, lock a profile
      const avgPitch=Math.round(voice.pitchSum/Math.max(1,voice.pitchN));
      const reg=avgPitch<140?'grave':avgPitch<220?'media':'aguda';
      const cur=mem.person.voice;
      if(!cur){mem.person.voice={pitch:avgPitch,reg};if(chatOn)chatSay(`Tu voz… ${reg}. Me gusta. Ahora sé que eres tú cuando hablas 🎙️`,3600)}
      else if(Math.abs(cur.pitch-avgPitch)<25){if(chatOn)chatSay(pick([`Esa voz… te conozco. Eres la misma persona de antes 🎙️`,`Hmm, tu voz me suena. La misma voz de antes.`]),3400)}
      else{if(chatOn)chatSay('Espera… tu voz suena diferente. ¿Eres otra persona? Dime tu nombre otra vez.',3800);mem.person.voice={pitch:avgPitch,reg}}
      voice.n=0;voice.sum=0;voice.sumSq=0;voice.pitchSum=0;voice.pitchN=0;
    }
  }
}

  for(let i=SP.length-1;i>=0;i--){const s=SP[i];s.l-=dt;s.vy+=700*dt;s.vx*=1-1.1*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.pts.push([s.x+Math.sin(t*14+i)*6,s.y]);if(s.pts.length>34)s.pts.shift();
    if(s.l<=0&&s.pts.length<3||s.y>H+60){SP.splice(i,1);continue}
    cx.strokeStyle=s.c;cx.lineWidth=5;cx.lineCap='round';cx.globalAlpha=clamp(s.l+.4);cx.beginPath();s.pts.forEach((p,j)=>j?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.stroke();}
  cx.globalAlpha=1;
}

/* ---------- invitados calavera: la ofrenda entre velas ---------- */
const SKULLS=[
  {n:'Angel',hat:'hood',c:'#E8A54B'},
  {n:'Betto',hat:'cap',c:'#F6B800'},
  {n:'Ariel',hat:'tophat',c:'#3A3A4A'},
  {n:'Alejandra',hat:'fedora',c:'#EDE3CB'},
  {n:'Bertha',hat:'flowers',c:'#D81B77'},
  {n:'Misael',hat:'visor',c:'#1E9B5A'},
  {n:'P',hat:'hood',c:'#E8A54B'},
  {n:'Yesica',hat:'flowers',c:'#B95438'},
  {n:'Maria',hat:'hood',c:'#D96C4A'}
];
function drawSkull(g,x,y,k,hat,hc,t,ph){
  const R=(dx,dy,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x+dx*k),Math.round(y+dy*k),Math.max(1,Math.round(w*k)),Math.max(1,Math.round(h*k)))};
  const bob=Math.round(Math.sin(t*1.4+ph)*1);
  // skull (bone)
  R(-4,-8+bob,8,7,'#E9E2CE');R(-3,-9+bob,6,1,'#E9E2CE');           // cranium
  R(-3,-1+bob,6,3,'#DDD4BC');                                        // jaw
  R(-2.5,-5.5+bob,2,2,'#2B1B3D');R(.5,-5.5+bob,2,2,'#2B1B3D');       // eyes
  R(-.5,-3+bob,1,1.5,'#2B1B3D');                                     // nose
  for(let i=0;i<3;i++)R(-1.5+i,-.2+bob,.5,1,'#2B1B3D');              // teeth
  R(-4,-8+bob,1,7,'#C9BFA2');                                        // shade
  // headpieces
  if(hat==='hood'){R(-5,-9+bob,10,3,hc);R(-5,-9+bob,2,9,hc);R(3,-9+bob,2,9,hc);R(-5,-1+bob,2,2,hc);R(3,-1+bob,2,2,hc)}
  else if(hat==='cap'){R(-4,-10+bob,8,3,hc);R(-4,-10+bob,8,1,'#fff3d6');R(2,-8+bob,5,1,hc)}
  else if(hat==='tophat'){R(-3,-14+bob,6,5,hc);R(-5,-9.5+bob,10,1.5,hc);R(-3,-10+bob,6,1,'#D81B77')}
  else if(hat==='fedora'){R(-3.5,-11+bob,7,3,hc);R(-5.5,-8.5+bob,11,1.5,hc);R(-3.5,-9+bob,7,1,'#8a7a5a')}
  else if(hat==='flowers'){for(let i=0;i<5;i++){const fx=-4+i*2,fy=-10+((i%2)?-1:0)+bob;R(fx,fy,2,2,i%2?'#F6B800':hc);R(fx+.5,fy+.5,1,1,'#fff3d6')}R(-4,-8.5+bob,8,1,'#1E9B5A')}
  else if(hat==='visor'){R(-4.5,-9+bob,9,2,hc);R(-4.5,-9+bob,9,.8,'#fff3d6');R(-4,-7+bob,8,1,hc)}
}
function drawCandle(g,x,y,k,t,ph){
  const R=(dx,dy,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x+dx*k),Math.round(y+dy*k),Math.max(1,Math.round(w*k)),Math.max(1,Math.round(h*k)))};
  R(-1.5,0,3,6,'#F6E6C8');R(-1.5,0,3,1,'#fff8e8');R(-.3,-1,0.6,1,'#8a7a5a'); // wax + wick
  const fl=Math.sin(t*9+ph)*.5+Math.sin(t*23+ph*2)*.3;                          // flicker
  const fh=2.2+fl;
  g.globalAlpha=.9;R(-.8,-1-fh,1.6,fh,'#F6B800');R(-.4,-1-fh*.6,.8,fh*.6,'#fff3d6');g.globalAlpha=1;
  g.globalAlpha=.14+Math.max(0,fl)*.06;g.fillStyle='#F6B800';                   // halo
  g.beginPath();g.arc(x,y-4*k,6*k,0,6.283);g.fill();g.globalAlpha=1;
}
function drawOfrenda(t){
  const k=Math.max(1.6,Math.min(2.6,W/340));
  const top=H*.16,step=Math.min(H*.17,120),m=Math.max(14,W*.045);
  SKULLS.forEach((sk,i)=>{
    const left=i%2===0,row=Math.floor(i/2);
    const x=left?m+8*k:W-m-8*k, y=top+row*step;
    if(y>H*.62)return;
    drawCandle(cx,x+(left?-5:5)*k,y+2*k,k*.9,t,i*1.7);
    drawSkull(cx,x,y,k,sk.hat,sk.c,t,i*.9);
    cx.fillStyle='rgba(43,27,61,.55)';cx.font=`${Math.round(4.2*k)}px Fredoka,sans-serif`;cx.textAlign='center';
    cx.fillText(sk.n,x,y+8.5*k);
  });
}

/* ---------- Claudio: pixel sprite (64x84 grid, drawn every frame) ---------- */
const PW=64,PH=92,pc=document.getElementById('wayra'),pg=pc.getContext('2d');pc.width=PW;pc.height=PH;
const INK='#2B1B3D',CRM='#F6E6C8',PAL=['#D81B77','#F6B800','#1AA6B7','#1E9B5A'];
const ORG='#E8763A',ORG_D='#C05A28',ORG_L='#F49A63';
const R=(x,y,w,h,c)=>{pg.fillStyle=c;pg.fillRect(Math.round(x),Math.round(y),w,h)};
function Zg(x,y,s){R(x,y,s,1,'#fff3d6');R(x,y+s-1,s,1,'#fff3d6');for(let i=0;i<s;i++)R(x+s-1-i,y+i,1,1,'#fff3d6')}
function drawWayra(p){
  pg.clearRect(0,0,PW,PH);
  const hop=Math.round(p.hop),sq=p.sq,sw=p.sw,hl=p.hl,fl=p.fl,t=p.t,hy=sq+p.bob;
  const sh=Math.max(14,40-hop*1.5);R(32-sh/2,89,sh,2,'rgba(43,27,61,.28)');
  // halo of orbiting pixels: calm when quiet, wide and fast when loud
  for(let i=0;i<12;i++){const a=t*(.5+p.n*1.8)*(i%2?1:-1)+i*.52,rx=22+(i%3)*3+p.n*5,s=2+(i%3===0?1:0);
    R(32+Math.cos(a)*rx-s/2,10-hop*0+46+Math.sin(a)*rx*.95-s/2,s,s,PAL[i%4]);}
  pg.save();pg.translate(0,10-hop);
  if(p.rot){pg.translate(32,62);pg.rotate(p.rot);pg.translate(-32,-62)}
  // body: one orange block with stubby legs (reference style)
  const lean=Math.round(sw*.6),bx=27+lean,by=40+sq,bw=10,bh=36;
  R(bx+2,by+2,bw,bh,ORG_D);              // drop shade
  R(bx,by,bw,bh,ORG);                    // block
  R(bx,by,bw,2,ORG_L);                   // top light
  R(bx+3,by+bh,5,4,ORG);R(bx+bw-8,by+bh,5,4,ORG);       // stubby legs
  R(bx+3,by+bh+4,5,1,ORG_D);R(bx+bw-8,by+bh+4,5,1,ORG_D);
  // arms: strings of beads ending in a diamond
  const arm=(sx,sy,deg,sg)=>{const a=deg*Math.PI/180,L=17;let k=0;
    for(let d=3;d<=L;d+=3.5,k++)R(sx+sg*Math.sin(a)*d-1.5,sy+Math.cos(a)*d-1.5,3,3,PAL[k%4]);
    const hx=sx+sg*Math.sin(a)*(L+4),hy2=sy+Math.cos(a)*(L+4);
    R(hx-1,hy2-3,3,7,CRM);R(hx-3,hy2-1,7,3,CRM);R(hx-1,hy2-1,3,3,'#F6B800');};
  arm(bx-2,by+4,p.oL,1);arm(bx+bw+2,by+4,p.oR,-1);
  // face on the block: two square eyes + a bar mouth
  const gxp=Math.max(-1,Math.min(1,Math.round(p.gx))),gyp=Math.max(0,Math.min(1,Math.round(p.gy+.5)));
  [26,30].forEach(x=>{
    if(p.sleep||p.blink)R(x,by+9+hy,4,1,INK);
    else if(p.joy){R(x,by+9+hy,1,1,INK);R(x+1,by+8+hy,2,1,INK);R(x+3,by+9+hy,1,1,INK)}
    else{R(x,by+6+hy,4,5,'#fff');R(x+1+gxp,by+7+hy+gyp,2,3,INK)}});
  R(25,by+13+hy,2,2,'#E8648F');R(33,by+13+hy,2,2,'#E8648F');
  const mh=p.sleep?0:Math.round(p.open*5);
  if(mh>=1){R(26,by+14+hy,8,1+mh,'#4a0f2a');if(mh>3)R(28,by+14+hy+mh,4,1,'#E8648F')}
  else{R(25,by+13+hy,1,1,INK);R(26,by+14+hy,8,1,INK);R(34,by+13+hy,1,1,INK)}
  // la jarra: appears on salud, drains sip by sip, flashes when seco
  if(glass.shown>0){
    const gx=52,gy=by+2+hy,gw=8,gh=12;
    glass.rect={x:gx,y:gy,w:gw,h:gh};
    const flash=glass.hi&&(Math.sin(t*10)>0);
    pg.globalAlpha=clamp(glass.shown);
    R(gx-1,gy-1,gw+2,gh+2,flash?'#F6B800':INK);          // rim / highlight
    R(gx,gy,gw,gh,'#fff3d6');                             // glass
    const lv=Math.round(glass.level*(gh-2));
    if(lv>0){R(gx+1,gy+gh-1-lv,gw-2,lv,'#F6B800');R(gx+1,gy+gh-1-lv,gw-2,1,'#fff3d6')} // drink + foam
    R(gx+2,gy+2,2,gh-4,'rgba(43,27,61,.12)');             // shade
    pg.globalAlpha=1;
  }
  pg.restore();
  if(p.sleep){const z=(t*.8)%1;Zg(50,26-z*8,4);Zg(54,18-z*6,3)}
}

let phase=0,amp=0,hatA=0,hatV=0,flapA=0,flapV=0,aL=18,aR=18,cheerUntil=0,blinkAt=2,blinkT=0,gx=0,gy=0,ptr={x:0,y:0,t:-9},headC={x:0,y:0,k:4},lastAct=performance.now()/1000,wasSleep=false;
function headPos(){const st=document.getElementById('stage').getBoundingClientRect();const k=Math.max(2,Math.floor(Math.min(st.width/PW,st.height/PH)));pc.style.width=PW*k+'px';pc.style.height=PH*k+'px';const r=pc.getBoundingClientRect();headC={x:r.left+r.width/2,y:r.top+r.height*.4,k}}
function cheer(sec){cheerUntil=performance.now()/1000+sec;lastCheer=cheerUntil}
function onClap(){cheer(.9);serp(W*.5,H*.6,Math.random()<.5?-1:1);confetti(W/2,H*.5,16,Math.PI,420,false);if(Math.random()<.5)say(pick(['¡Aplausos! 👏','¡Bravo!','¡Otra, otra!']),1800)}
let lastBurst=0;
function onBeat(now){
  if(S.bpm){const e=((phase/Math.PI)%1+1.5)%1-.5;phase-=e*Math.PI*.4}else phase=Math.round(phase/Math.PI)*Math.PI;
  if(S.n>.5&&now-lastBurst>.5&&style()>=1){lastBurst=now;cannons(560+S.n*500,Math.round(3+S.n*9))}
}
const glowEl=document.getElementById('glow');
function frame(dt,t,now){
  const n=S.n,act=S.active,cheering=now<cheerUntil;
  if(folk&&now>folkUntil){folk=null}
  const folkOn=!!folk;
  const sty=folk?folk.style:style();
  if(move&&now>moveUntil)move=null;
  const moveOn=!!move;
  if(act||S.tapE>.05||cheering||folkOn||moveOn)lastAct=now;
  const sleeping=now-lastAct>25;
  if(wasSleep&&!sleeping){say('¡Ah! ¡No estaba dormida!',2200)}wasSleep=sleeping;
  amp=lerp(amp,act?.3+.7*n:0,Math.min(1,dt*6))*(RM?.5:1)||0;
  const bpm=S.bpm||100;phase+=dt*bpm/60*Math.PI;
  const sp=Math.sin(phase),ab=Math.abs(sp),cs=Math.cos(phase);
  const listening=S.mode==='voces'&&act&&!cheering;
  let hop=amp*ab*[3,6,11][sty]*(folk?folk.hop:1)+(cheering?Math.abs(Math.sin(t*14))*4:0);
  const idle=Math.sin(t*.8);
  let sw=cs*amp*[2.4,2,1.2][sty]*(folk?folk.sway:1)+idle*(1-amp)*(sleeping?.3:.8);
  let rot=0;
  if(move==='la vuelta'){rot=Math.sin(t*9)*.5;sw=Math.sin(t*9)*3;hop=amp*ab*6+2}
  else if(move==='el desliz'){sw=Math.sin(t*2.2)*6;hop=0;rot=Math.sin(t*2.2)*.12}
  else if(move==='la ola'){sw=Math.sin(t*5)*2.5;hop=Math.abs(Math.sin(t*5))*3;rot=Math.sin(t*5)*.2}
  else if(move==='el robot'){const q=x=>Math.round(x*2)/2;sw=q(Math.sin(t*4))*3;hop=q(Math.abs(Math.sin(t*4)))*4;rot=q(Math.sin(t*4))*.15}
  else if(move==='el twist'){rot=Math.sin(t*11)*.35;sw=Math.sin(t*11)*1.5;hop=amp*ab*3}
  else if(move==='el salto'){hop=Math.abs(Math.sin(t*6))*14;sw=Math.sin(t*6)*1.5}
  const sq=(amp>.3&&ab<.25)?1:0;
  hatV+=((-sw*1.2-hatA)*90-hatV*9)*dt;hatA+=hatV*dt;
  flapV+=((sw*2-hop*.15-flapA)*70-flapV*6)*dt;flapA+=flapV*dt;
  let oL,oR;
  if(cheering){oL=oR=160+Math.sin(t*22)*10}
  else if(move==='la vuelta'){oL=oR=150+Math.sin(t*9)*20}
  else if(move==='el desliz'){oL=40+Math.sin(t*2.2)*15;oR=40-Math.sin(t*2.2)*15}
  else if(move==='la ola'){oL=90+60*Math.sin(t*5);oR=90+60*Math.sin(t*5+1.2)}
  else if(move==='el robot'){const q=x=>Math.round(x/15)*15;oL=q(70+40*Math.sin(t*4));oR=q(70-40*Math.sin(t*4))}
  else if(move==='el twist'){oL=60+50*Math.sin(t*11);oR=60-50*Math.sin(t*11)}
  else if(move==='el salto'){oL=oR=160}
  else if(folk&&folk.arms==='alto'){oL=oR=120+40*amp*sp}
  else if(folk&&folk.arms==='bajo'){oL=15+10*amp*sp;oR=15-10*amp*sp}
  else if(folk&&folk.arms==='latigo'){oL=90+70*amp*Math.sin(phase*2);oR=90-70*amp*Math.sin(phase*2)}
  else if(folk&&folk.arms==='panuelo'){oR=150+20*Math.sin(t*6);oL=30+20*amp*sp}
  else if(folk&&folk.arms==='guardia'){oL=60+30*amp*ab;oR=60+30*amp*Math.abs(cs)}
  else if(folk&&folk.arms==='garra'){oL=100+50*amp*Math.sin(phase*3);oR=100-50*amp*Math.sin(phase*3)}
  else if(folk&&folk.arms==='hilado'){oL=45+35*Math.sin(t*4);oR=45+35*Math.cos(t*4)}
  else if(folk&&folk.arms==='lanza'){oR=140+30*amp*sp;oL=25}
  else if(sty===0){oL=20+25*amp*sp;oR=20-25*amp*sp}
  else if(sty===1){oL=45+50*amp*sp;oR=45-50*amp*sp}
  else{oL=oR=110+55*amp*ab}
  if(!act&&!cheering){oL=oR=sleeping?6:14+idle*2}
  if(listening){oR=128+Math.sin(t*3)*4;oL=18}
  aL=lerp(aL,oL,Math.min(1,dt*14));aR=lerp(aR,oR,Math.min(1,dt*14));
  blinkT-=dt;if(t>blinkAt){blinkT=.13;blinkAt=t+rnd(1.8,5)}
  const fresh=t-ptr.t<4;let tx,ty;
  if(fresh){tx=clamp((ptr.x-headC.x)/(headC.k*30),-1,1);ty=clamp((ptr.y-headC.y)/(headC.k*30),-1,1)}
  else{tx=Math.sin(t*.7)*.8+(act?cs*.5:0);ty=Math.sin(t*.5+1)*.8}
  gx=lerp(gx,tx,Math.min(1,dt*8));gy=lerp(gy,ty,Math.min(1,dt*8));
  let open=0;
  if(cheering)open=.95;else if(listening)open=.25+.3*n*Math.abs(Math.sin(t*9));else if(act&&S.mode==='música')open=n*(.35+.65*Math.abs(Math.sin(phase*2)));else if(act)open=n*.4;
  const bob=Math.round(amp*Math.abs(Math.sin(phase*2))*1.2+(listening?Math.abs(Math.sin(t*7))*n*1.2:0)+(sleeping?(Math.sin(t*1.2)>.3?1:0):0));
  chatTick(now);voiceSample();
  // jarra logic: sip by sip while the party is loud; highlight fades
  if(glass.shown>0&&glass.level>0&&act&&now-glass.lastSip>6){glass.lastSip=now;glass.level=Math.max(0,glass.level-.25);if(glass.level<=0){glass.hi=1;say('¡Seco! 😮',1800);setTimeout(()=>{if(glass.hi&&glass.level<=0){say('Invítame 🥺',2600);glass.asked=true}},2400);}}
  if(glass.hi&&glass.level>0)glass.hi=0;
  if(glass.shown>0&&glass.level<=0&&!glass.hi&&now-glass.lastSip>20)glass.shown=Math.max(0,glass.shown-dt*.2);
  drawWayra({amp,n,hop,sw,sq,hl:clamp(hatA,-3,3),fl:clamp(flapA,-3,3),oL:aL,oR:aR,open,joy:(amp>.55&&sty>=1)||cheering||moveOn,blink:blinkT>0,sleep:sleeping,gx,gy,bob,t,rot:rot||0});
  glowEl.style.transform=`scale(${(.8+S.bass*1.2+S.tapE*.2).toFixed(3)})`;glowEl.style.opacity=(.22+.6*Math.min(1,S.bass*2.2+n*.4)).toFixed(2);
  if(act&&n>.3&&Math.random()<dt*n*6){confetti(rnd(0,W),-10,1,.2,60,false);const q=P[P.length-1];if(q)q.vy=rnd(60,160)}
}

/* ---------- input: touch/clap on screen = a beat Wayra can learn ---------- */
addEventListener('pointerdown',e=>{
  if(e.target.closest('button,details'))return;
  const now=performance.now()/1000;ptr={x:e.clientX,y:e.clientY,t:now};
  ensureCtxQuiet();
  // tap the jarra to refill it
  if(glass.shown>0&&glass.rect){
    const r=pc.getBoundingClientRect(),k=headC.k,pad=6;
    const gx=r.left+glass.rect.x*k,gy=r.top+glass.rect.y*k,gw=glass.rect.w*k,gh=glass.rect.h*k;
    if(e.clientX>gx-pad*k&&e.clientX<gx+gw+pad*k&&e.clientY>gy-pad*k&&e.clientY<gy+gh+pad*k){
      hearInvitame();return;
    }
  }
  addOnset(now,true);estimateBpm(now);confetti(e.clientX,e.clientY,26,Math.PI,380,false);
  if(Math.random()<.3)serp(e.clientX,e.clientY,Math.random()<.5?-1:1);
  onBeat(now);
},{passive:true});
addEventListener('pointermove',e=>{if(e.pressure>0||e.buttons)ptr={x:e.clientX,y:e.clientY,t:performance.now()/1000}},{passive:true});
function ensureCtxQuiet(){}
$('#bMic').onclick=toggleMic;
$('#bMus').onclick=toggleMusic;
$('#bMix').onclick=()=>{cannons(900,34);serp(W*.1,H*.8,1);serp(W*.9,H*.8,-1);serp(W*.5,H*.9,Math.random()<.5?-1:1);cheer(1.6);say(pick(['¡¡Mixtura!! 🎊','¡Que llueva!','¡Viva la fiesta!']),2200);addOnset(performance.now()/1000,true);};
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));

/* ---------- loop ---------- */
let last=performance.now()/1000,acc=0;
function loop(){
  const now=performance.now()/1000,dt=Math.min(.05,now-last);last=now;
  try{analyse(dt,now);frame(dt,now,now);drawFx(dt,now);}catch(e){}
  acc+=dt;if(acc>=1){acc=0;try{tick1s(now)}catch(e){}}
  requestAnimationFrame(loop);
}
resize();setTimeout(headPos,400);
setTimeout(()=>{
  const h=new Date().getHours();
  say(returning?`¡Otra vez tú! Visita #${mem.visits}. Ya conozco este cuarto.`:(h<12?'¡Buenos días! ¿Ya hay fiesta?':h<19?'¡Buenas tardes! Llegué temprano a la fiesta.':'¡Buenas noches! Ya es hora de bailar.'),4200);
  confetti(W/2,H*.35,30,Math.PI,300,false);
},700);
setTimeout(()=>{if(!micOn&&!mus.on)note('Toca 🎤 para que Claudio escuche, 🎶 para ponerle banda, o toca la pantalla al ritmo. Di «Claudio» y responde.')},5200);
quietSince=performance.now()/1000;
requestAnimationFrame(loop);
})();
